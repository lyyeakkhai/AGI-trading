<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3036"/>
      <stop offset="50%" stop-color="#14171A"/>
      <stop offset="100%" stop-color="#080A0C"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Casing -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#titanium)" stroke="#38424B" stroke-width="2"/>

  <!-- Chamfered Corner Cyan Bumpers -->
  <path d="M13 5 L7 11" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M51 5 L57 11" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M7 53 L13 59" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M57 53 L51 59" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Inner Dark Obsidian Core Plate -->
  <rect x="8" y="8" width="48" height="48" rx="10" fill="#030405" stroke="#161B20" stroke-width="1.5"/>

  <!-- Outer Delta Triangle -->
  <polygon points="32,16 48,45 16,45" fill="none" stroke="url(#cyanGlow)" stroke-width="2.4" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Concentric Delta -->
  <polygon points="32,25 41,41 23,41" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Center Quantum Node -->
  <circle cx="32" cy="35" r="2.2" fill="#00E5FF" filter="url(#glow)"/>

  <!-- Micro-Bus Tracers -->
  <line x1="32" y1="17" x2="32" y2="24" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="25" y1="43" x2="20" y2="43" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="39" y1="43" x2="44" y2="43" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round"/>
</svg>