services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"         # ONLY service publishing a host port
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - trading-net
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      - APP_ENV
      - TRADING_MODE
      - LIVE_TRADING_ENABLED
      - DATABASE_URL
      - REDIS_URL
      - DASHBOARD_AUTH_SECRET
    networks:
      - trading-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: timescale/timescaledb-ha:pg16-latest
    environment:
      POSTGRES_DB: trading_paper
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - trading-net
    # NO ports: published — private network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    networks:
      - trading-net
    # NO ports: published — private network only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  trading-net:
    driver: bridge

volumes:
  pgdata:
